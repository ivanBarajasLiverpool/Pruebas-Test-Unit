name: Propose unit tests for PR changes

on:
  pull_request:
    types: [opened, synchronize, reopened]

permissions:
  contents: read
  actions: read
  pull-requests: write

concurrency:
  group: unit-test-agent-${{ github.repository }}-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  unit-tests:
    uses: ./.github/workflows/unit-test-agent.yml
    with:
      # Local development uses the trusted base; external consumers pin a release SHA.
      agent-ref: ${{ github.event.pull_request.base.sha }}
    secrets:
      UNIT_TEST_AGENT_API_KEY: ${{ secrets.UNIT_TEST_AGENT_API_KEY }}
