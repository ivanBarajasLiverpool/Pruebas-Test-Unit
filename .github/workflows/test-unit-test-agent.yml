name: Validate unit-test agent

on:
  pull_request:
    paths:
      - '.github/workflows/*unit-test*.yml'
      - 'automation/**'
      - 'unit_test_agent/**'
      - 'unit-test-agent.json'
      - 'tests/**'
      - 'agent-starter-pack-main/Calculadora/**'
  push:
    branches: [main]
    paths:
      - 'automation/**'
      - 'unit_test_agent/**'
      - 'tests/**'
      - 'agent-starter-pack-main/Calculadora/**'

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.12'
      - name: Install existing test dependency
        run: python -m pip install pytest==7.4.4
      - name: Build sandbox
        run: docker build --tag unit-test-agent:local automation
      - name: Test agent and isolation without model credentials
        env:
          TEST_UNIT_AGENT_DOCKER: '1'
        run: python -m pytest tests -q
      - name: Test pilot
        working-directory: agent-starter-pack-main
        run: python -m pytest Calculadora/tests -q
