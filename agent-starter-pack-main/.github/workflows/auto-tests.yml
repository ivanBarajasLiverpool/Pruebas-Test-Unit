name: Auto-Generate & Run Tests

on:
  push:
    branches: [main, develop, "feature/**"]
  pull_request:
    branches: [main, develop]

permissions:
  contents: write    # Necesario para hacer commit automático
  checks: write
  pull-requests: write

jobs:
  auto-test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout del código
        uses: actions/checkout@v4
        with:
          # Permite hacer push de vuelta
          ref: ${{ github.head_ref || github.ref_name }}

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Instalar dependencias
        run: |
          pip install --upgrade pip
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi
          if [ -f requirements-test.txt ]; then pip install -r requirements-test.txt; fi

      # 1. Generar pruebas automáticamente si faltan
      - name: Generar pruebas faltantes
        run: python generate_tests.py

      # 2. Hacer commit automático si se crearon pruebas nuevas
      - name: Auto-commit de nuevas pruebas
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "chore(tests): auto-generar pruebas unitarias para nuevos módulos"
          file_pattern: "tests/*.py"

      # 3. Ejecutar las pruebas inmediatamente
      - name: Ejecutar Pruebas con Pytest
        run: pytest -n auto